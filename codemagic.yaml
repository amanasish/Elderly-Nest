workflows:
  default-workflow:
    name: Elderly Nest Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: Frontend
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Regenerate platform directories
        script: |
          flutter create --platforms=android .
      - name: Add Internet Permission for Release Build
        script: |
          node -e "
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let content = fs.readFileSync(file, 'utf8');
          if (!content.includes('android.permission.INTERNET')) {
            content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application');
          }
          fs.writeFileSync(file, content);
          "
      - name: Fetch Flutter dependencies
        script: |
          flutter pub get
      - name: Build Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
